<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>Siya’s Physiotherapy & Rehabilitation Centre | Move Better, Feel Stronger</title>
    <meta name="description" content="Expert physiotherapy, rehabilitation, and pain management for back pain, neck pain, and knee mobility at Siya’s Physiotherapy & Rehabilitation Centre." />
    <meta name="keywords" content="physiotherapy centre, rehabilitation clinic, back pain relief, neck pain treatment, knee rehabilitation, physical therapy" />
    <meta name="theme-color" content="#0B192C" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Siya’s Physiotherapy & Rehabilitation Centre | Advanced Physiotherapy & Clinical Care" />
    <meta property="og:description" content="Move Better. Feel Stronger. Live Healthier. Expert Physiotherapy & Rehabilitation for a pain-free life." />
    <meta property="og:site_name" content="Siya’s Physiotherapy & Rehabilitation Centre" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Physiotherapy",
      "name": "Siya’s Physiotherapy & Rehabilitation Centre",
      "description": "Expert Physiotherapy & Rehabilitation for a Pain-Free and Active Life.",
      "medicalSpecialty": "Physiotherapy",
      "availableService": [
        {
          "@type": "MedicalTherapy",
          "name": "Back Pain Physiotherapy"
        },
        {
          "@type": "MedicalTherapy",
          "name": "Neck & Shoulder Pain Physiotherapy"
        },
        {
          "@type": "MedicalTherapy",
          "name": "Knee Pain Rehabilitation"
        }
      ],
      "potentialAction": {
        "@type": "ReserveAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://wa.me/?text=AppointmentEnquiry"
        },
        "result": {
          "@type": "Reservation",
          "name": "Physiotherapy Appointment Enquiry"
        }
      }
    }
    </script>
  </head>
  <body class="bg-brand-background text-slate-800 font-sans antialiased selection:bg-brand-purple-200 selection:text-brand-purple-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
